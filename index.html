<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM - เอาคุณค่าในชีวิตคืนมา</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { width: 100%; max-width: 800px; text-align: center; }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .btn-cta {
            display: inline-block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }
        .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <div class="container">
        <!-- ส่วนวิดีโอ (เปลี่ยน YOUR_VIDEO_ID เป็นรหัสคลิป YouTube) -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID?rel=0&modestbranding=1&controls=1" 
                    title="ATM Project Video" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>

        <!-- ปุ่มสมัคร (เปลี่ยนลิงก์ปลายทางเป็น LINE OA ของเจ้านาย) -->
        <a href="https://line.me/R/ti/p/@YOUR_LINE_ID" target="_blank" class="btn-cta">
            🚀 สมัครสมาชิก / เริ่มต้นใช้งานระบบ
        </a>
    </div>

    <script>
        // บล็อกปุ่มลัดดูซอร์สโค้ด ป้องกันการขโมย
        document.addEventListener('keydown', function(event) {
            if (event.keyCode == 123 || 
                (event.ctrlKey && event.shiftKey && event.keyCode == 73) || 
                (event.ctrlKey && event.keyCode == 85)) {
                event.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
